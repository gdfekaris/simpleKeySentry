[package]
name = "simple-key-sentry"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "A privacy-first local secrets scanner"
license = "MIT"
repository = "https://github.com/gdfekaris/simpleKeySentry"

[[bin]]
name = "sks"
path = "src/main.rs"

[dependencies]
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] } # serde: cache serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
walkdir = "2" # recursive directory traversal for EnvFileCollector
serde_json = "1" # JSON reporter output serialization
clap = { version = "4", features = ["derive"] } # CLI argument parsing
serde_yaml_ng = "0.10" # YAML config parsing for structured file extractor
rust-ini = "0.21" # INI config parsing for structured file extractor
globset = "0.4" # gitignore-style glob pattern matching for .sentryignore path exclusions
rusqlite = { version = "0.32", features = ["bundled"] } # read-only SQLite access for clipboard managers (Clipy, CopyQ) and Firefox localStorage
snap = "1" # Snappy decompression for Chrome LevelDB SSTables (localStorage extraction)
dialoguer = "0.11" # Interactive terminal prompts (confirm, multi-select) for guided scan mode
indicatif = "0.18" # Progress bars for interactive scan execution screen
console = "0.16" # Terminal key reading for interactive results review (transitive dep of indicatif)

[dev-dependencies]
tempfile = "3" # temporary directories for LevelDB and other tests

[profile.release]
lto = true
codegen-units = 1
strip = true
